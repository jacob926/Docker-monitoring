groups:
  - name: surveillance_infrastructure
    rules:
      # 1. Vérifie si un service surveillé par Prometheus ne répond plus
      - alert: ServiceHorsLigne
        expr: up == 0
        for: 5s
        labels:
          severity: critical
        annotations:
          description: "Le service {{ $labels.job }} ({{ $labels.instance }}) est inaccessible depuis 30 secondes."

      # 2. Vérifie l'arrêt spécifique du conteneur Nginx (via cAdvisor)
      - alert: SiteWebArrete
        expr: absent(container_last_seen{name="mon-site-web"})
        for: 5s
        labels:
          severity: critical
        annotations:
          description: "Le conteneur Docker mon-site-web est arrêté ou introuvable."

      # 3. Alerte si le processeur dépasse 80 % d'utilisation (via Node Exporter)
      - alert: SaturationCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          description: "Utilisation CPU élevée ({{ printf \"%.1f\" $value }} %) sur {{ $labels.instance }}."

      # 4. Alerte si la mémoire RAM disponible passe sous les 15 % (via Node Exporter)
      - alert: MemoireRAMFaible
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
        for: 1m
        labels:
          severity: warning
        annotations:
          description: "Il reste moins de 15 % de mémoire RAM disponible ({{ printf \"%.1f\" $value }} % restants)."
